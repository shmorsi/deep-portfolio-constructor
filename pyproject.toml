[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpc"
version = "0.1.0"
description = "Deep Portfolio Constructor: a transformer that builds a long-only portfolio for long-term wealth, trained on the growth of wealth after costs through a differentiable simulator. The archived long-short study is in docs/longshort.md."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sherif Morsi" }]

[project.urls]
Homepage = "https://shmorsi.github.io/projects/deep-portfolio-constructor.html"
Repository = "https://github.com/shmorsi/deep-portfolio-constructor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    # Third-party: cvxpylayers' diffcp interface calls np.array(..., copy=False)
    # on objects that predate NumPy 2's copy keyword. Harmless; filtered narrowly
    # so that any *other* warning still shows up.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning:cvxpylayers.*",
]
